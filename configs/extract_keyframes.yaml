# @package _global_

# Video input configuration
video_path: "data/input_video.mp4"

# VAE model settings
latent_dim: 128
vae_checkpoint: "" # Optional path to pretrained VAE checkpoint

# Keyframe extraction settings
tau: 1.5 # Euclidean distance threshold in Latent Vector space (τ)
use_dummy_if_missing: true # Fallback to dummy data for verification

# Output configuration
output_json: "outputs/keyframes/keyframes.json"

# Hydra execution log confinement
hydra:
  run:
    dir: "outputs/logs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "outputs/logs/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}"

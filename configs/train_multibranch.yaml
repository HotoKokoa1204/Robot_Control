# @package _global_

# Data settings
one_path_dir: "data/one_path"
rotation_dir: "data/360"
img_height: 108
img_width: 192
video_fps: 60.0
straight_video_speed_mps: 2.5
buffer_distance_meters: 2.0
max_rotation_deg: 30.0 # Restrict rotation pair angle conditioning to +-30 degrees
recon_source: "random"
use_dummy_if_missing: true
rotation_one_per_subfolder: true # Pick at most 1 rotation video per subfolder in data/360
preload_frames: true # Set true to preload frames into RAM (~5GB for 88 videos, eliminates CPU bottleneck and maximizes GPU utilization)
num_samples: 1600 # Pairs sampled per epoch (1600 = 100 batches; set null for full 2300 pairs)

# Model architecture settings
latent_dim: 512
hidden_dim: 512
num_blocks: 5
block_inner_dim: 512

# Optimization hyperparameters
lr: 0.0001 # Learning rate for transformers in Stage 2
lr_trans: 0.0001 # Learning rate for transformers in Stage 2 (aliased with lr)
lr_vae_stage1: 0.0001 # Learning rate for VAE in Stage 1
lr_vae_stage3: 0.00001 # Fine-tuning learning rate for VAE in Stage 3
lr_vae: 0.00001 # Backwards compatibility alias for lr_vae_stage3
batch_size: 16
gradient_accumulation_steps: 2
use_amp: true
max_epochs: 150
stage1_epochs: 50
stage2_epochs: 50
stage3_epochs: 50
warmup_vae_epochs: 50 # Backwards compatibility alias for stage1_epochs

# Multi-branch loss weights
alpha_perc: 0.5
beta_kl: 0.0 # 0.0 for pure deterministic Autoencoder mode (no Gaussian KL penalty)
w_fwd: 1.0
w_rot: 1.0
w_recon: 1.0
w_latent: 1.0 # Target weight for latent dynamics alignment
w_latent_min: 0.01
w_latent_max: 1.0
w_latent_ramp_start_epoch: 61
sanity_check_min_std: 15.0 # Quality gate threshold at end of Stage 1

# Checkpoints and output settings
output_dir: "checkpoints"
vae_checkpoint: null
save_interval_epochs: 5
num_workers: 0
seed: 42
device: null

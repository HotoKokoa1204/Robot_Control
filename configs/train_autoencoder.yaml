# @package _global_

# Data settings
data_root: "data"
categories:
  - "360"
  - "one_path"
max_videos_per_category: 2
frameskip: 4
img_height: 108
img_width: 192

# Model architecture settings
latent_dim: 128

# Optimization hyperparameters
lr: 0.001
batch_size: 16
max_epochs: 2

# Output checkpoint path
output_checkpoint: "checkpoints/autoencoder.pt"

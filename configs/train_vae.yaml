# @package _global_

# Data settings
data_root: "data"
categories:
  - "360"
one_per_subfolder_categories:
  - "360"
max_videos_per_category: null
frameskip: 1
img_height: 108
img_width: 192
cache_path: ".cache/vae_dataset_cache_360_46v.npy"

# Model architecture settings
latent_dim: 512
variational: true
beta_kl: 0.0001
latent_l2: 0.0

# Optimization hyperparameters
lr: 0.0001
batch_size: 64
max_epochs: 100

# Output checkpoint path
output_checkpoint: "checkpoints/vae.pt"

# Hydra execution log confinement
hydra:
  run:
    dir: "outputs/logs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "outputs/logs/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}"
